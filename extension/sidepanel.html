<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="拾句 · X 文字卡片">拾句 · X 文字卡片</title><script src="i18n.js"></script><script src="theme.js"></script><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="brand"><div class="brand-identity"><img class="brand-logo" src="icons/icon128.png" alt="" width="30" height="30"><h1>拾句</h1></div><div class="brand-actions"><a id="repository" class="icon-button repo-button" href="https://github.com/zkilxx/shiju-x-card" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库" data-i18n-aria="打开 GitHub 仓库" title="打开 GitHub 仓库" data-i18n-title="打开 GitHub 仓库"><svg viewBox="0 0 16 16" aria-hidden="true"></svg></a><button id="settings" class="icon-button" aria-label="编辑账号资料" data-i18n-aria="编辑账号资料" title="编辑账号资料" data-i18n-title="编辑账号资料"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1v4l-2 1 2 2v3l3 1 1 3h5l1-3 3-1v-3l2-2-2-1V7l-3-1-1-3Z"/><circle cx="11.5" cy="12" r="3"/></svg></button></div></header>
    <div class="toolbar"><label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span class="sr-only" data-i18n="语言">语言</span><select id="languageMode" aria-label="语言" data-i18n-aria="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg><span class="sr-only" data-i18n="界面主题">界面主题</span><select id="themeMode" aria-label="界面主题" data-i18n-aria="界面主题" title="界面主题" data-i18n-title="界面主题"><option value="system" data-i18n="跟随系统">跟随系统</option><option value="light" data-i18n="浅色">浅色</option><option value="dark" data-i18n="深色">深色</option></select></label></div>
    <section class="account" aria-label="当前账号" data-i18n-aria="当前账号"><div id="avatar" class="avatar"><img src="icons/icon128.png" alt=""></div><div class="account-info"><strong id="accountName" data-i18n="示例账号">示例账号</strong><a id="accountHandle" target="_blank" rel="noopener noreferrer">@yourname</a><span id="accountStatus" data-i18n="未关联 · 打开 X 后同步">未关联 · 打开 X 后同步</span></div><button id="sync" class="icon-button" aria-label="同步当前 X 账号" data-i18n-aria="同步当前 X 账号" title="同步当前 X 账号" data-i18n-title="同步当前 X 账号"><svg viewBox="0 0 24 24"><path d="M20 5v6h-6M20 11a8 8 0 1 0-1 7"/></svg></button></section>
    <section class="section"><div class="section-heading"><h2 data-i18n="模板">模板</h2><span id="templateName" data-i18n="素白">素白</span></div><div id="templates" class="templates" role="group" aria-label="卡片模板" data-i18n-aria="卡片模板"></div></section>
    <aside id="tweetSource" class="tweet-source" hidden aria-label="当前推文来源" data-i18n-aria="当前推文来源"><a id="sourceLink" target="_blank" rel="noopener noreferrer" data-i18n="原推文">原推文</a><button id="restoreDraft" type="button" data-i18n="返回我的草稿">返回我的草稿</button></aside>
    <section class="section"><div class="section-heading"><h2 data-i18n="文字">文字</h2><span id="saveStatus" aria-live="polite" data-i18n="本机草稿">本机草稿</span></div><div class="editor"><label for="title"><span data-i18n="标题">标题</span> <span data-i18n="（选填）">（选填）</span></label><input id="title" maxlength="80" value="把想法，留在这一刻。" placeholder="给这张卡片一个标题" data-i18n-placeholder="给这张卡片一个标题"><div class="counter" id="titleCount">0/80</div><label for="body" data-i18n="正文">正文</label><textarea id="body" maxlength="2400" rows="5" placeholder="写下想分享的文字……" data-i18n-placeholder="写下想分享的文字……">好的表达，不必很大声。

记下一个念头，分享一点日常。
让文字有自己的样子。</textarea><div class="counter" id="bodyCount">0/2400</div></div></section>
    <section class="section"><div class="section-heading"><h2 data-i18n="预览">预览</h2><select id="ratio" aria-label="卡片比例" data-i18n-aria="卡片比例"><option value="auto" data-i18n="自动高度">自动高度</option><option value="square" data-i18n="正方形 1:1">正方形 1:1</option><option value="portrait" data-i18n="竖版 4:5">竖版 4:5</option></select></div><div class="preview-stage"><canvas id="preview" role="img" aria-label="卡片实时预览" data-i18n-aria="卡片实时预览"></canvas></div><div class="preview-meta"><span id="dimensions">1080 × 1080</span></div><div class="typography-controls"><label class="size-control"><span data-i18n="标题字号">标题字号</span> <input type="range" id="titleSize" min="48" max="144" step="1" value="106" aria-label="标题字号" data-i18n-aria="标题字号"><output id="titleSizeLabel" for="titleSize">106</output></label><label class="size-control"><span data-i18n="正文字号">正文字号</span> <input type="range" id="fontSize" min="30" max="50" value="38" aria-label="正文字号" data-i18n-aria="正文字号"><output id="fontSizeLabel" for="fontSize">38</output></label><label class="size-control" title="回车即分段，调节段落之间的额外留白；自动换行的行距不变，按 1080px 宽度计算" data-i18n-title="回车即分段，调节段落之间的额外留白；自动换行的行距不变，按 1080px 宽度计算"><span data-i18n="段间距">段间距</span> <input type="range" id="paragraphSpacing" min="0" max="160" step="1" value="70" aria-label="段间距" data-i18n-aria="段间距"><output id="paragraphSpacingLabel" for="paragraphSpacing">70px</output></label><label class="size-control" title="标题与正文之间的距离，按 1080px 卡片宽度计算" data-i18n-title="标题与正文之间的距离，按 1080px 卡片宽度计算"><span data-i18n="标题到正文">标题到正文</span> <input type="range" id="titleBodyGap" min="0" max="160" step="1" value="38" aria-label="标题到正文间距" data-i18n-aria="标题到正文间距"><output id="titleBodyGapLabel" for="titleBodyGap">38px</output></label></div></section>
    <div class="export-options"><label><span data-i18n="导出格式">导出格式</span><select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option></select></label><label><span data-i18n="宽度">宽度</span><select id="resolution"><option value="1080">1080px</option><option value="2160" selected data-i18n="2160px · 高清">2160px · 高清</option><option value="3240" data-i18n="3240px · 超清">3240px · 超清</option></select></label></div>
    <button id="export" class="export-button"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span data-i18n="导出卡片">导出卡片</span></button>
    <p id="notice" class="notice" role="status" aria-live="polite"></p><footer data-i18n="草稿自动保存在本机">草稿自动保存在本机</footer>
  </main>
  <dialog id="profileDialog"><form id="profileForm"><div class="dialog-heading"><h2 data-i18n="账号资料">账号资料</h2><button type="button" id="closeDialog" class="icon-button" aria-label="关闭" data-i18n-aria="关闭">×</button></div><p class="help" data-i18n="可从当前 X 账号同步，也可以手动填写。">可从当前 X 账号同步，也可以手动填写。</p><label for="profileName" data-i18n="昵称">昵称</label><input id="profileName" required maxlength="60" placeholder="你的昵称" data-i18n-placeholder="你的昵称"><label for="profileHandle" data-i18n="X ID">X ID</label><div class="handle-input"><span>@</span><input id="profileHandle" required pattern="[A-Za-z0-9_]{1,15}" maxlength="15" placeholder="yourname" data-i18n-placeholder="yourname"></div><label for="avatarFile" data-i18n="头像（选填）">头像（选填）</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"><p class="help" data-i18n="主页链接将自动显示为 x.com/你的ID。">主页链接将自动显示为 x.com/你的ID。</p><button type="submit" class="export-button" data-i18n="保存资料">保存资料</button><p id="profileError" class="notice" role="alert"></p></form></dialog>
  <script src="account.js"></script><script type="module" src="panel.js"></script>
</body></html>
